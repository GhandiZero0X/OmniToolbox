<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Beranda{% endblock %} · OmniToolbox</title>

  <!-- Terapkan tema tersimpan sebelum halaman tampil (mencegah kedip) -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("omni-theme");
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-bs-theme", theme);
      } catch (e) {}
    })();
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  {% set ep = request.endpoint %}
  <nav class="navbar navbar-expand-md border-bottom bg-body sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">
        <i class="bi bi-tools text-primary me-1"></i>OmniToolbox
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-menu"
              aria-controls="nav-menu" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav-menu">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link {{ 'active' if ep == 'main.index' }}" href="{{ url_for('main.index') }}">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ 'active' if ep == 'image.compress_page' }}" href="{{ url_for('image.compress_page') }}">Kompres Gambar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ 'active' if ep == 'image.convert_page' }}" href="{{ url_for('image.convert_page') }}">Konversi Gambar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {{ 'active' if ep == 'pdf.compress_page' }}" href="{{ url_for('pdf.compress_page') }}">Kompres PDF</a>
          </li>
        </ul>
        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Ganti tema">
          <i class="bi bi-moon-stars"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top py-3 mt-5">
    <div class="container small text-body-secondary d-flex flex-wrap justify-content-between gap-2">
      <span>OmniToolbox &middot; File diproses sementara dan dihapus otomatis.</span>
      <span>Dibuat dengan Flask &amp; Bootstrap</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
